name: Feature request
description: Propose a change to this independent Picco build
title: "Short, descriptive title of the request"
labels: ["enhancement", "needs-scope-review"]
body:
  - type: markdown
    attributes:
      value: |
        Read this fork's [scope](https://github.com/DumbledoreCalrissian/crosspoint-reader/blob/picco/SCOPE.md)
        and [roadmap](https://github.com/DumbledoreCalrissian/crosspoint-reader/blob/picco/ROADMAP.md).
        Todo, Pomodoro and Sudoku are intentional features. Upstream acceptance rules do not apply here.
        EPUB statistics has its own bounded milestones; another format, device or theme needs a separate owner decision.
  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope
      options:
        - label: I have read this fork's scope and roadmap.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: Describe the concrete Picco workflow and what is missing or broken.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the user-visible result and existing mechanisms that might meet the need.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Resource and maintenance cost
      description: Include known RAM, PSRAM, flash, storage, power or dependency costs; label estimates and unknowns.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Relevant source references, screenshots or owner decisions.
